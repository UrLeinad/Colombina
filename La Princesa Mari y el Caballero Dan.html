<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Princesa Mari y el Caballero Dan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#7a2a63;--bg2:#3b1245;--bg3:#17081f;--pink:#ff6fa5;--rose:#c2185b;--gold:#e8b84a;--gold-l:#ffe9c7;--ink:#4a1d33;--panel:255,240,246;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#5e1f4d;--bg2:#2a0d33;--bg3:#0d0412}}
:root[data-theme="dark"]{--bg1:#5e1f4d;--bg2:#2a0d33;--bg3:#0d0412}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2) 45%,var(--bg3));font-family:'Lora',Georgia,serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;min-height:100vh}
.dust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.d{position:absolute;background:#ffd3e6;border-radius:50%;opacity:.8;will-change:transform;animation:up var(--dur) infinite linear}
@keyframes up{0%{transform:translateY(105vh);opacity:0}20%{opacity:.9}100%{transform:translateY(-10vh) translateX(calc(var(--dir)*50px));opacity:0}}
@keyframes flt{50%{transform:translateY(-4px)}}
@keyframes hb{50%{transform:scale(1.18)}}
@keyframes tw{50%{opacity:.2}}
@keyframes rn{to{transform:translate(-20px,70px);opacity:0}}
.tw{animation:tw 3s infinite}
.page:not(.cur) *{animation:none!important}.page.far{visibility:hidden}
.bgs{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.fl{transform-box:fill-box;transform-origin:center;animation:hb 2s infinite ease-in-out}.rn{animation:rn 1s linear infinite}
.music-btn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:50;background:rgba(40,10,40,.78);border:1px solid var(--pink);color:#ffe3ef;padding:8px 14px;border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer}
.wrap{position:relative;z-index:10;width:100%;max-width:460px;height:640px;max-height:82vh;perspective:2000px;margin:auto}
.book{position:relative;width:100%;height:100%;transform-style:preserve-3d;border-radius:4px 18px 18px 4px;box-shadow:4px 0 0 #f5e6d3,8px 0 0 #e8d5ba,12px 0 0 #d8c1a0,16px 8px 24px rgba(0,0,0,.45)}
.page{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.5,.05,.25,1),opacity .1s;user-select:none}
.fr,.bk{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px 18px 18px 4px;background:#fbf0e2;border:1px solid #e0cba9}
.bk{transform:rotateY(180deg);border-radius:18px 4px 4px 18px;background:linear-gradient(to left,#f0dcc3,#fbf0e2 35%)}
.lines{position:absolute;inset:60px 34px;background:repeating-linear-gradient(transparent 0 25px,rgba(176,101,131,.16) 25px 26px)}
.gr{position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%,rgba(120,60,40,.06))}
.fr::after,.bk::after{content:'';position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(to left,rgba(70,10,40,.45),transparent 70%);opacity:0;transition:opacity 1.1s}
.bk::after{opacity:1;background:linear-gradient(to right,rgba(70,10,40,.45),transparent 70%)}
.page.flipped .fr::after{opacity:1}
.page.flipped .bk::after{opacity:0}
.page.flipped{transform:rotateY(-180deg);opacity:0;pointer-events:none;transition:transform 1.1s cubic-bezier(.5,.05,.25,1),opacity .2s 1s}
.fr::before,.bk::before{content:'';position:absolute;top:0;bottom:0;left:0;width:22px;background:linear-gradient(to right,rgba(60,10,30,.4),transparent);z-index:5;pointer-events:none}
.bk::before{left:auto;right:0;background:linear-gradient(to left,rgba(60,10,30,.4),transparent)}
.scene{position:absolute;inset:10px 10px 10px 20px;width:calc(100% - 30px);height:calc(100% - 20px);border-radius:3px 12px 12px 3px;box-shadow:0 0 0 1px rgba(160,100,70,.3)}
.frame{position:absolute;inset:16px 16px 16px 26px;border:1.5px solid rgba(232,184,74,.9);border-radius:2px 12px 12px 2px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.frame::after{content:'';position:absolute;inset:4px;border:1px solid rgba(255,255,255,.45);border-radius:2px 9px 9px 2px}
.hd{text-align:center;padding:14px 12px 0;text-shadow:0 2px 8px rgba(80,10,50,.7)}
.hd small{display:block;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:#fff;font-weight:600}
.hd h2{font-family:'Cinzel Decorative',serif;font-size:1.25rem;color:#fff;margin-top:3px;font-weight:900}
.panel{position:relative;z-index:2;padding:34px 18px 10px 20px;background:linear-gradient(to bottom,rgba(var(--panel),0),rgba(var(--panel),.9) 22%,rgba(var(--panel),.96));max-height:62%;overflow:auto;pointer-events:auto}
.story{font-size:.88rem;line-height:1.48;text-align:justify;color:var(--ink)}
.story em{color:var(--rose);font-style:normal;font-weight:600}
.story::first-letter{font-family:'Cinzel Decorative',serif;float:left;font-size:2.7rem;line-height:.8;padding:4px 7px 0 0;color:var(--rose)}
.nodrop::first-letter{all:unset}
.ft{display:flex;justify-content:space-between;font-size:.68rem;color:#b06583;padding-top:6px;margin-top:6px;border-top:1px solid rgba(232,184,74,.5);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.fin{font-family:'Cinzel Decorative',serif;font-size:3.4rem;color:var(--rose);text-align:center;text-shadow:2px 3px 0 rgba(255,111,165,.4)}
.cap{font-family:'Caveat',cursive;font-size:1.3rem;text-align:center;color:#a03a62}
.epi{font-family:'Caveat',cursive;font-size:1.18rem;line-height:1.32;text-align:justify;color:#5a1f3a}
.sign{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--rose);text-align:right;margin-top:6px;font-weight:700}
.cover .fr,.cover .bk{background:radial-gradient(circle at 30% 15%,#d04a7c,#8a1f4d 55%,#4f0b2d);border:3px solid var(--gold)}
.cover .fr::before{background:repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 2px,transparent 2px 5px);width:auto;right:0}
.cover .scene{inset:152px 42px 150px 50px;width:calc(100% - 92px);height:calc(100% - 302px);border-radius:48% 48% 12px 12px/26% 26% 12px 12px;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(79,11,45,.6),0 0 24px rgba(255,200,120,.45)}
.cover .frame{justify-content:flex-start}.cover .sub{margin-top:auto}
.rib{position:absolute;right:30px;bottom:-30px;width:24px;height:90px;background:linear-gradient(#ffb3d1,#e0457f);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:6}
@keyframes sh{to{background-position:-200% 0}}
.cover .frame{align-items:center;text-align:center;padding:26px 16px;color:#fff}
.cover small{font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold-l)}
.cover h1{font-family:'Cinzel Decorative',serif;font-size:1.5rem;line-height:1.25;margin-top:8px;background:linear-gradient(100deg,#ffe9c7 20%,#fff 40%,#e8b84a 60%,#ffe9c7 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.sub{font-family:'Caveat',cursive;font-size:1.45rem;color:#ffe3ef;max-width:290px;text-shadow:0 2px 6px rgba(80,10,50,.8)}
.open-btn{pointer-events:auto;background:linear-gradient(135deg,#ff9ec8,#e0457f);color:#fff;border:none;padding:13px 26px;border-radius:999px;font:700 1rem 'Lora',serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 16px rgba(255,111,165,.8);margin-top:10px}
.controls{position:relative;z-index:10;display:flex;align-items:center;gap:16px;margin-top:22px}
.nav-btn{background:rgba(60,10,50,.78);color:#ffe3ef;border:1px solid var(--pink);padding:10px 20px;border-radius:999px;font:600 .92rem 'Lora',serif;cursor:pointer}
.nav-btn:hover:not(:disabled){background:var(--pink);color:#fff}.nav-btn:disabled{opacity:.25}
.ind{color:#ffe3ef;font-size:.92rem;min-width:110px;text-align:center;font-weight:600}
@media(max-width:420px){.wrap{height:590px}.story{font-size:.8rem;line-height:1.42}.epi{font-size:1.08rem}.hd h2{font-size:1.1rem}.cover h1{font-size:1.4rem}}
</style>
</head>
<body>
<div class="dust" id="dust"></div>
<button class="music-btn" id="musicToggle" onclick="toggleMusic()">🎵 Melodía: Apagada</button>
<div class="wrap" id="bookWrapper"><div class="book" id="book"></div></div>
<div class="controls">
<button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>← Volver</button>
<span class="ind" id="ind">Portada</span>
<button class="nav-btn" id="nextBtn" onclick="nextPage()">Pasar hoja →</button>
</div>
<script>
/* ---------- helpers de dibujo ---------- */
let gi=0;
const R=n=>{let s=n;return()=>(s=(s*9301+49297)%233280)/233280};
const sky=(...c)=>{const id='g'+gi++;return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${c.map((x,i)=>`<stop offset="${i/(c.length-1)}" stop-color="${x}"/>`).join('')}</linearGradient></defs><rect width="400" height="560" fill="url(#${id})"/>`};
const stars=(n,seed,h)=>{const r=R(seed);let o='';for(let i=0;i<n;i++)o+=`<circle class="tw" style="animation-delay:${(r()*3).toFixed(1)}s" cx="${r()*400|0}" cy="${r()*h|0}" r="${(r()*1.5+.6).toFixed(1)}" fill="#fff"/>`;return o};
const hill=(y,c,a=40)=>`<path d="M0 ${y}Q100 ${y-a} 200 ${y}T400 ${y}V560H0Z" fill="${c}"/>`;
const hr=(x,y,s=1,c='#ff6fa5')=>`<g transform="translate(${x} ${y}) scale(${s})"><path class="fl" d="M0 8C-14-2-10-14 0-6C10-14 14-2 0 8Z" fill="${c}"/></g>`;
const star=(x,y,s=1,c='#fff7b0')=>`<g transform="translate(${x} ${y}) scale(${s})"><path class="fl" d="M0-10L3-3L10 0L3 3L0 10L-3 3L-10 0L-3-3Z" fill="${c}"/></g>`;
const cloud=(x,y,s=1,c='#fff')=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}" opacity=".9"><ellipse rx="30" ry="11"/><ellipse cx="14" cy="-8" rx="18" ry="11"/><ellipse cx="-14" cy="-6" rx="15" ry="9"/></g>`;
const castle=(x,y,c,f,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-30" y="-50" width="60" height="50" fill="${c}"/><rect x="-40" y="-80" width="22" height="80" fill="${c}"/><rect x="18" y="-80" width="22" height="80" fill="${c}"/><path d="M-44-80L-29-104L-14-80ZM14-80L29-104L44-80Z" fill="${f}"/><path d="M-8 0V-20Q0-30 8-20V0Z" fill="rgba(0,0,0,.25)"/><path d="M0-50V-76L14-70L0-64" stroke="${f}" fill="${f}" stroke-width="2"/></g>`;
const env=(x,y,r)=>`<g transform="translate(${x} ${y}) rotate(${r})"><g class="fl"><rect x="-12" y="-8" width="24" height="16" rx="2" fill="#fff0f5" stroke="#ff6fa5" stroke-width="1.5"/><path d="M-12-8L0 2L12-8" stroke="#ff6fa5" fill="none" stroke-width="1.5"/></g></g>`;
const bub=(x,y)=>`<g class="fl" transform="translate(${x} ${y})"><rect x="-18" y="-14" width="36" height="26" rx="12" fill="#fff0f5"/><path d="M-4 12L-10 20L4 12Z" fill="#fff0f5"/><path d="M0 6C-9-1-6-9 0-4C6-9 9-1 0 6Z" fill="#ff6fa5"/></g>`;
const mari=(x,y,s=1,o={})=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-9 14H9L32 76H-32Z" fill="#ff7aa8" stroke="#d6336c" stroke-width="2"/><path d="M-7 22H7" stroke="#ffd54f" stroke-width="4"/><path d="M0 52C-10 44-6 38 0 43C6 38 10 44 0 52Z" fill="#fff"/><path d="M-12 20L${o.u?-27:-22} ${o.u?0:40}M12 20L${o.u?27:22} ${o.u?0:40}" stroke="#ffd9bf" stroke-width="5" stroke-linecap="round"/><path d="M-20-2Q-24-28 0-26Q24-28 20-2Q24 24 15 32H-15Q-24 24-20-2Z" fill="#6b3a2a"/><circle r="15" fill="#ffd9bf"/><path d="M-10-13L-9-27L-3-19L0-30L3-19L9-27L10-13Z" fill="#ffd54f" stroke="#e0a800"/><circle cx="-5.5" cy="1" r="2.3" fill="#3a1d1d"/><circle cx="5.5" cy="1" r="2.3" fill="#3a1d1d"/><circle cx="-9" cy="6" r="3" fill="#ff7aa8" opacity=".6"/><circle cx="9" cy="6" r="3" fill="#ff7aa8" opacity=".6"/><path d="M-3 8Q0 ${o.sad?6:11} 3 8" stroke="#a33" stroke-width="1.6" fill="none"/>${o.sad?'<path d="M-8 4Q-9 11-8 12Q-6 11-8 4Z" fill="#7ec8ff"/>':''}</g>`;
const dan=(x,y,s=1,o={})=>{const r=o.r??1;return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-9 50V76M9 50V76" stroke="#7d8798" stroke-width="10" stroke-linecap="round"/><path d="M-14 18L${o.u?-27:-23} ${o.u?0:40}M14 18L${o.u?27:23} ${o.u?0:40}" stroke="#aab3c2" stroke-width="8" stroke-linecap="round"/><rect x="-16" y="14" width="32" height="38" rx="8" fill="#aab3c2" stroke="#5b6578" stroke-width="2"/><g fill="#b5651d" opacity="${r}"><circle cx="-7" cy="26" r="5"/><circle cx="8" cy="40" r="6"/><circle cx="-6" cy="45" r="3"/></g>${r<.5?'<path d="M0 40C-9 32-5 26 0 31C5 26 9 32 0 40Z" fill="#ff6fa5"/>':''}<circle r="14" fill="#f1c9a5"/><path d="M-15-3Q-16-21 0-21Q16-21 15-3Q8-11 0-10Q-8-11-15-3Z" fill="#3b2a24"/><circle cx="-5" cy="1" r="2.2" fill="#222"/><circle cx="5" cy="1" r="2.2" fill="#222"/><circle cx="-9" cy="6" r="2.8" fill="#ff8fa8" opacity=".5"/><circle cx="9" cy="6" r="2.8" fill="#ff8fa8" opacity=".5"/><path d="M-3 8Q0 ${o.sad?6:11} 3 8" stroke="#8a3a2a" stroke-width="1.6" fill="none"/>${o.sw?'<path d="M30 46V-22M22 30H38" stroke="#ffd54f" stroke-width="4" stroke-linecap="round"/>':''}</g>`};
const drg=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30-10L-60-50L-20-30ZM10-30L40-70L40-20Z" fill="#7a6ab0"/><ellipse rx="42" ry="30" fill="#8e7fc4"/><ellipse cy="10" rx="28" ry="16" fill="#c9c0ec"/><circle cx="-38" cy="-20" r="18" fill="#8e7fc4"/><circle cx="-44" cy="-24" r="3.5" fill="#fff"/><circle cx="-44" cy="-24" r="1.8" fill="#222"/><path d="M-52-12Q-46-8-40-12" stroke="#4a3a80" stroke-width="2" fill="none"/><path d="M-30 30L-34 44M20 30L24 44" stroke="#7a6ab0" stroke-width="8" stroke-linecap="round"/><path d="M40 5Q70 10 62-25" stroke="#8e7fc4" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M-60-10Q-66 0-60 6Q-54 0-60-10Z" fill="#7ec8ff"/></g>`;
const rain=()=>{const r=R(9);let o='';for(let i=0;i<45;i++){const x=r()*400|0,y=r()*300|0;o+=`<path class="rn" style="animation-delay:-${(r()*1.2).toFixed(2)}s" d="M${x} ${y}l-4 14" stroke="#cfd8ff" stroke-width="1.5" opacity=".7"/>`}return o};
const hearts=(n,seed,h,cols=['#ff6fa5','#fff','#ffb3d1'])=>{const r=R(seed);let o='';for(let i=0;i<n;i++)o+=hr(r()*400|0,r()*h|0,r()*.8+.5,cols[i%cols.length]);return o};
const house=(x,y)=>`<g transform="translate(${x} ${y})"><rect x="-34" y="-44" width="68" height="44" fill="#fff0f5" stroke="#ff6fa5" stroke-width="2"/><path d="M-42-44L0-80L42-44Z" fill="#ff6fa5"/><rect x="-9" y="-24" width="18" height="24" rx="9" fill="#c2185b"/><path d="M-22-28C-30-34-27-40-22-36C-17-40-14-34-22-28Z" fill="#ff6fa5"/></g>`;

/* ---------- escenas ---------- */
const S={
cover:()=>sky('#5a1a4d','#b0366f','#ff8fb8')+stars(40,1,300)+cloud(70,120,1,'#ffc2dc')+cloud(330,90,1.1,'#ffc2dc')+hill(380,'#7a2a63',30)+mari(160,265,1.05)+dan(245,265,1.05,{r:.5})+hr(200,300,1.8)+hearts(10,4,230),
a1:()=>sky('#ffd6e6','#ffb0cf','#e49ad6')+'<circle cx="200" cy="170" r="42" fill="#fff3b0" opacity=".9"/>'+cloud(70,130,1)+cloud(330,110,1.1)+castle(62,300,'#ffc2da','#ff6fa5',.85)+castle(338,300,'#c9d3e6','#7a8bb0',.85)+hill(295,'#ff9ec4',30)+'<path d="M115 140Q200 80 285 140" stroke="#fff" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/>'+star(200,95,1.6)+hr(150,118,.8)+hr(250,118,.8)+mari(100,200)+dan(300,200),
a2:()=>sky('#2b0b3d','#7a2a7a','#ff8fb8')+stars(50,2,260)+hill(300,'#3c1450')+'<path d="M110 150Q200 60 290 150" stroke="#ffc2dc" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" fill="none"/>'+env(150,112,-20)+env(205,88,5)+env(255,115,20)+hr(125,140,.6)+hr(280,140,.6)+hr(180,100,.5,'#fff')+mari(90,200)+dan(310,200),
a3:()=>sky('#12062a','#3a1560','#8a2f7f')+stars(70,3,280)+'<circle cx="200" cy="120" r="85" fill="#ffb3d1" opacity=".22"/><circle cx="200" cy="120" r="58" fill="#fff0f5"/><circle cx="182" cy="105" r="9" fill="#ffd6e6"/><circle cx="220" cy="135" r="12" fill="#ffd6e6"/>'+hill(305,'#2a0f3c')+bub(110,150)+bub(290,150)+mari(105,205)+dan(295,205),
a4:()=>sky('#3b1450','#7a2a7a','#ff8fb8')+stars(30,5,250)+'<path d="M0 0H255Q150 60 140 200Q130 330 200 400H400V560H0Z" fill="#1d0e26"/><path d="M300 60L50 320L230 340Z" fill="#ff9ccf" opacity=".2"/>'+star(290,58,1.8)+star(330,70,1.8)+'<path d="M0 330Q120 300 260 340T400 340V560H0Z" fill="#150a1c"/>'+dan(100,225,1,{sad:1}),
a5:()=>sky('#8c8aa8','#6b6a8c','#4a4766')+cloud(70,60,1.5,'#4d4b68')+cloud(220,40,1.8,'#55536f')+cloud(340,80,1.4,'#4d4b68')+rain()+hill(310,'#3b3a55')+mari(115,200,1,{sad:1})+dan(310,200,1,{u:1})+'<text x="310" y="150" font-size="30" fill="#ffd54f" text-anchor="middle" font-weight="700">!</text>',
a6:()=>sky('#ffb08a','#d9667f','#5a2a55')+cloud(80,90,1.2,'#ffd1c0')+cloud(320,70,1,'#ffd1c0')+hill(310,'#3a1a40')+dan(115,195,1.15,{sw:1,u:0})+drg(290,230,1.1)+star(210,120,1.2,'#ffe08a')+hr(60,170,.6,'#fff'),

const P=[
{l:'Portada',cover:1,s:S.cover},
{l:'I. Lejanos',n:'Capítulo I',t:'Reinos muy lejanos',f:'El inicio de la magia',s:S.a1,x:'Había una vez, en un reino que quedaba al otro lado del mapa, una princesa llamada Mari. Ella tenía la sonrisa más dulce y los ojos más hermosos de todo el lugar, pero para alguien en especial, ella era simplemente su <em>osita</em>. Muy lejos de ahí vivía el Caballero Dan, un muchacho terco que andaba por la vida cargando una armadura pesada y medio oxidada, creyendo que así nada le iba a doler. Entre los dos había montañas, ríos y un montón de kilómetros… pero las estrellas ya los tenían en el mismo cielo.'},
{l:'II. Mensajes',n:'Capítulo II',t:'Mensajes mágicos',f:'Cartitas con alas',s:S.a2,x:'Como vivían en reinos distintos, usaban magia para enviarse mensajitos que cruzaban montañas enteras. Cada vez que una cartita llegaba, el castillo de Dan se llenaba de luz y él sonreía como tonto sin saber por qué. Entre pláticas largas y risas de la nada, Dan sintió algo loquito: esa <em>osita</em> tenía una ternura rara y hermosa, de esas que uno no sabe explicar pero tampoco quiere dejar de sentir.'},
{l:'III. Madrugadas',n:'Capítulo III',t:'Madrugadas con luna',f:'Hasta que la luna se durmió',s:S.a3,x:'Las noches se volvieron el momento favorito de los dos reinos. Cuando todos dormían, Mari y Dan seguían despiertos hablando de todo y de nada, hasta que la luna se cansaba de esperar y se iba a dormir primero. Dan todavía no lo sabía, pero cada madrugada con ella era un hechizo que le iba ablandando el corazón, un poquito más cada vez.'},
{l:'IV. La cueva',n:'Capítulo IV',t:'La cueva oscura',f:'Ojitos de estrella',s:S.a4,x:'Lo que Mari no sabía es que Dan tenía una cueva oscura donde a veces se escondía sin decirle a nadie. Allá adentro hacía frío y la armadura pesaba más que nunca. Pero un día, desde muy lejos, aparecieron dos lucecitas: los <em>ojitos de estrella</em> de la princesa. Con solo existir a la distancia iluminaron toda la cueva, y Dan entendió que ya no quería estar tan solo.'},
{l:'V. Días grises',n:'Capítulo V',t:'Días grises',f:'Nubes sobre el reino',s:S.a5,x:'Un día el cielo se puso gris y llegaron días tristes para Mari. Las nubes se acomodaron justo encima de su reino y hasta la lluvia parecía pesada. Dan lo sintió desde sus montañas, como si la tristeza de ella también le llegara por los mensajes mágicos. Y su corazón terco, que jamás se había preocupado así por nadie, decidió que tenía que hacer algo.'},
{l:'VI. Armadura',n:'Capítulo VI',t:'La armadura oxidada',f:'El falso héroe',s:S.a6,x:'Apenas Dan vio eso, agarró su espada y su escudo todo raspado, creyéndose el gran héroe del cuento. Juró matar todos los dragones de la tristeza que se le acercaran a su niña. Quería ser el caballero rudo que la protegiera del mundo y que nunca permitiera que derramara ni media lágrima. Claro… la armadura rechinaba tanto que hasta los dragones se morían de la risa.'},
{l:'VII. Rescate',n:'Capítulo VII',t:'El verdadero rescate',f:'Quién salvó a quién',s:S.a7,x:'Pero aquí viene lo chistoso del cuento. Mientras Dan peleaba a lo tonto creyendo que la rescataba, fue la princesa quien hizo el milagro real. Con su infinita paciencia, sus abrazos virtuales de <em>osita</em> y su forma tan pura de querer, le fue quitando lo oxidado a la armadura de él. Dan juraba que él la salvó a ella... pero la verdad es que Mari le salvó la vida y el corazón a él.'},
{l:'VIII. Kilómetros',n:'Capítulo VIII',t:'Kilómetros en el medio',f:'El camino de corazones',s:S.a8,x:'Aun así, el mapa seguía siendo cruel: todavía quedaban kilómetros en el medio. Hay noches en que a Dan le duele no poder cruzar el camino de un solo salto y darle un abrazo de oso a su osita. Pero cada mensaje, cada risa y cada “buenas noches” es una piedrita más que los va acercando. Ninguno de los dos piensa soltar al otro.'},
{l:'IX. Osita',n:'Capítulo IX',t:'Un nombre bonito',f:'Osita',s:S.b1,x:'Un día Dan se dio cuenta de que ya no la llamaba princesa a secas. Para él era su <em>osita</em>: tierna por fuera, valiente por dentro y con un abrazo que, aunque fuera virtual, le calentaba el pecho como chocolate caliente. Desde entonces, cada vez que decía osita, el reino entero parecía sonreír.'},
{l:'X. Risas',n:'Capítulo X',t:'Risas que cruzan reinos',f:'Medicina real',s:S.b2,x:'Había días en que Mari y Dan se reían tanto, cada uno en su reino, que las aves se confundían y volaban de un castillo al otro buscando de dónde venía tanta alegría. Dan jamás había reído así. Descubrió que las risas de ella eran la mejor medicina del mundo y que su sonrisa arreglaba hasta el peor de sus días.'},
{l:'XI. Canciones',n:'Capítulo XI',t:'Nuestra banda sonora',f:'Bailando a la distancia',s:S.b3,x:'Mari y Dan también inventaron su propia banda sonora: canciones que se mandaban, melodías que repetían sin cansarse y frases que solo ellos entendían. Cuando una de esas canciones sonaba, los dos cerraban los ojos y por un ratito, aunque los separaran todos los kilómetros del mapa, bailaban juntos.'},
{l:'XII. Buenos días',n:'Capítulo XII',t:'Cartita de buenos días',f:'El mejor comienzo',s:S.b4,x:'Cada mañana el sol salía y, antes que nada, una cartita rosada cruzaba el cielo: “buenos días, osita”. Dan descubrió que esas tres palabras podían cambiarle el humor al castillo entero, y que despertar sabiendo que ella existe es el mejor comienzo de día que un caballero puede pedir.'},
{l:'XIII. Sin armadura',n:'Capítulo XIII',t:'Pieza por pieza',f:'Más fuerte sin escudo',s:S.b5,x:'Poco a poco Dan empezó a quitarse piezas de la armadura. Primero el casco, para que ella viera sus ojos. Luego el escudo, porque a su lado ya no necesitaba defenderse de nada. Le daba miedo quedarse así, pero Mari lo miraba con tanta dulzura que entendió que sin armadura se sentía más fuerte, no más débil.'},
{l:'XIV. Arcoíris',n:'Capítulo XIV',t:'Después de la tormenta',f:'Cuidarse es amar',s:S.b6,x:'Hubo tormentas, claro, porque hasta en los mejores cuentos llueve. Pero Mari y Dan aprendieron a cuidarse: ella con su paciencia, él con su terquedad ya más suave. Y después de cada tormenta aparecía un arcoíris enorme que cruzaba los dos reinos, como diciéndoles que iban por muy buen camino.'},
{l:'XV. Sueños',n:'Capítulo XV',t:'El mismo sueño',f:'Un tesoro para cuidar',s:S.b7,x:'Cuando se acostaban a soñar, los dos soñaban parecido: una casita con ventanas grandes, un jardín lleno de flores rosadas, risas en la cocina y la mano de ella dentro de la de él. Y Dan, que antes no creía en los sueños, ahora los cuidaba como el tesoro más grande de todo el reino.'},
{l:'XVI. Estrellas',n:'Capítulo XVI',t:'El corazón del cielo',f:'Escrito en las estrellas',s:S.b8,x:'Una noche Dan miró el cielo y vio dos estrellas, muy lejos una de otra, brillando con la misma luz. Si uno las unía con otras vecinas, formaban un corazón. Dan sonrió: el universo ya lo había escrito mucho antes que ellos. Solo faltaba que el camino terminara de acercarlos.'},
{l:'XVII. Una casita',n:'Capítulo XVII',t:'Una casita para dos',f:'De la mano de Dios',s:S.a9,x:'Y como todo buen cuento tiene su final feliz, estos dos ya saben el suyo: agarrados fuertecito de la mano de Dios, un día la distancia se va a morir. Los dos castillos se volverán una sola casita, con flores en la ventana y una luz prendida esperando a cada uno. Y ese día el caballero, ya sin armadura, le dirá a su princesa lo que hoy le dice todos los días: <em>te elijo</em>.'},
{l:'Fin',n:'Cierre del cuento',t:'Y colorín colorado…',f:'Cierre del cuento',s:S.fin,nd:1,x:'<div class="fin">FIN</div><p class="cap">(Pero de este libro nada más... pasa la hoja ✨)</p>'},
{l:'4 meses 💗',n:'Una fecha especial',t:'Felices 4 meses 💗',f:'Cuatro meses contigo',s:S.m4,x:'Hoy este cuento cumple cuatro meses, mi <em>osita</em>. Cuatro meses de madrugadas, de risas, de mensajitos que cruzan montañas y de aprender que sí se puede querer fuerte aunque haya kilómetros en el medio. Gracias por cada día, por tu paciencia con este caballero terco y por hacerme tan feliz. Felices 4 meses, mi princesa: aquí sigo, y aquí me quedo. Te elijo, hoy y todos los días.'},
{l:'Para ti ❤️',n:'Nuestra promesa',t:'Para ti, mi niña...',f:'Nuestra promesa',s:S.epi,big:1,x:'<p class="epi">Este cuento está lleno de nosotros. Así de loquito fue como me enamoré de ti, una niña de ojos hermosos, desde la distancia. Y aunque todavía tenemos esos kilómetros en el medio y a veces me duele no poder abrazarte ya mismo, eres mi osita y te elijo todos los días.<br><br>Gracias por salvar mi corazón sin darte cuenta. Sé perfectamente que con todo este amor que nos tenemos, y agarrados fuerte de la mano de Dios, un día esa distancia se va a morir. Estaremos juntos, nos vamos a casar, y este cuento lo seguiremos escribiendo en nuestra misma casa.</p><div class="sign">Te amo, tu Caballero Dan ❤️</div>'},
{l:'Contraportada',back:1,s:S.backc}
];

const pages=document.querySelectorAll('.page'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),ind=document.getElementById('ind');
let cur=0;setTimeout(()=>update());
function update(){pages.forEach((p,i)=>{p.classList.toggle('flipped',i<cur);p.classList.toggle('cur',i===cur||i===cur-1);p.classList.toggle('far',i<cur-1||i>cur+2)});prevBtn.disabled=cur===0;nextBtn.disabled=cur===pages.length-1;ind.textContent=P[cur].l}
function nextPage(){if(cur<pages.length-1){cur++;update();flip()}}
function prevPage(){if(cur>0){cur--;update();flip()}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage()});
let tx=0;const bw=document.getElementById('bookWrapper');
bw.addEventListener('touchstart',e=>tx=e.changedTouches[0].screenX,{passive:true});
bw.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].screenX;if(d>50)nextPage();else if(d<-50)prevPage()},{passive:true});

function flip(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const n=ac.sampleRate*.5|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='highpass';f.frequency.value=1800;g.gain.value=.05;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
